          - code [ref=e261]: $295F–$2961
          - text: 의 명령어 조각에는 따로 이름을 붙였다. 이번 디스어셈블리 작업에서는 게임 동작을 더 고치지 않았다.
        - paragraph [ref=e262]: 주소 검증문은 고정된 배치가 어긋나지 않도록 지켜 준다. 같은 크기의 명령어나 데이터를 바꾸는 일은 간단하지만, 바이트를 끼워 넣으려면 패딩을 조정하고 고정 주소에 대한 가정을 확인해야 한다. 소스에 적힌 주소와 바이트 주석은 기준 버전의 값이다.

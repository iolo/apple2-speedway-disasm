      - generic [ref=e228]:
        - heading "6. 디스어셈블리 읽기" [level=2] [ref=e229]
        - heading "실제로 실행할 주소를 기준으로 어셈블하기" [level=3] [ref=e230]
        - paragraph [ref=e231]:
          - text: 프로그램은

          - code [ref=e234]: $4000
          - text: 을 더하면 된다.
        - code [ref=e236]: "# Labels use runtime addresses. DOS loads the resulting raw bytes at $4400; # the $0300 relocation stub moves them down by $4000 before entry at $2970. MEMORY { RUNTIME: start = $0400, size = $2600, type = rw, file = %O; } SEGMENTS { PAYLOAD: load = RUNTIME, type = ro; }"
        - paragraph [ref=e237]:
          - text: 별도로
          - code [ref=e238]: $0300
          - text: 에 설치하는 로더는 모니터의 원본·끝·목적지 포인터를 설정하고,
          - code [ref=e239]: $FE2C
          - text: 의 MOVE를 호출한 뒤 잠시 기다렸다가
          - code [ref=e240]: $2970
          - text: 의
          - code [ref=e241]: game_entry
          - text: 로 이동한다. 전체 소스는 아래에 수록했다. 원시 바이너리를 처음 적재한 주소에서 곧바로 BRUN하는 용도는 아니다.
        - heading "코드는 명령어로, 그림은 데이터로" [level=3] [ref=e242]
        - paragraph [ref=e243]:
          - code [ref=e244]: $2970
          - text: 에서 시작해 호출, 점프, 분기와 순차 실행을 따라가면
          - strong [ref=e245]: 도달 가능한 명령어 1,281개, 총 2,673바이트
          - text: 를 확인할 수 있다. 이 밖에 참조하는 곳을 찾지 못한 명령어 조각 두 개가 11바이트를 차지한다. 나머지 7,044바이트는 보존한 데이터와 패딩이다. 배경 그림의 픽셀을 실행 가능한 명령어로 잘못 해석하지 않도록 구분했다.
        - paragraph [ref=e246]:
          - text: 중간 크기와 큰 크기의 차량 스프라이트는
          - code [ref=e247]: $FF
          - text: 를 행 종료 표시로 사용한다. 플레이어 스프라이트에서는 0이 투명색이다. 타이틀과 게임 종료 그림은 화면의 미사용 구멍 영역까지 포함해 1 KB 페이지의 모든 바이트를 보존했다. 데이터는 읽을 수 있는
          - code [ref=e248]: .byte
          - text: 선언으로 수록했으며, 빌드는
          - code [ref=e249]: INCBIN

      - generic [ref=f1e37]:
        - heading "1. The race" [level=2] [ref=f1e38]
        - paragraph [ref=f1e39]: "The original editors describe a race around Jeju Island, with Hallasan in the background. The highway is crowded: cars approach along the road, large signs loom at its edges, and a sharp curve can suddenly leave the car badly placed. The scenery moves with the road and your steering, helping a small block-graphics display feel like a much wider world."
        - paragraph [ref=f1e40]: You need paddle 0 or the horizontal axis of an Apple II joystick. Press button 0 at the title screen to begin. During the race, that same button is the brake. Use it in short bursts to make room among the traffic. Keep it held down and the brake will burn out; it then stays unusable for the rest of the game.
        - paragraph [ref=f1e41]: The score rises as you drive and stops rising while the working brake is held. You have ten cars to use up. After a collision the program flashes an explosion, reduces the allowance, and puts you back on the road. At game over it compares the score with the high score, then lets you start again.
        - generic [ref=f1e42]:
          - figure "The starting line as photographed in the December 1984 article, printed page 88. This is a scan crop from the restored source." [ref=f1e43]:
            - 'img "The original magazine''s black-and-white photograph of the game: START above a chequered starting line." [ref=f1e44]'
          - figure "The repaired game’s title screen in MAME. “PUSH SW0” means paddle/joystick button 0. As above, the capture is displayed at twice its raw vertical scale." [ref=f1e46]:
            - img "The repaired game's colour title screen reading CROWDED SPEED WAY, with PUSH SW0 below." [ref=f1e48]
        - paragraph [ref=f1e50]: The 1984 article credits an earlier appearance in the January 1983 issue of Japan’s ASCII. That attribution is reported here from the Korean article; the earlier Japanese publication has not been independently checked for this edition.
      - generic [ref=f1e51]:
        - heading "2. Run it on an Apple II" [level=2] [ref=f1e52]
        - paragraph [ref=f1e53]:
          - text: The supplied image is a bootable 140 KB DOS 3.3 disk in DOS sector order. Mount it as drive 1 and boot. Its
          - code [ref=f1e54]: HELLO
          - text: program automatically runs
          - code [ref=f1e55]: SPEEDWAY-RUN
          - text: ". If DOS is already running with the disk mounted, enter:"
        - code [ref=f1e57]: RUN SPEEDWAY-RUN
        - paragraph [ref=f1e58]:
          - text: "Use an Apple II with Applesoft ROMs and at least 48 KB of RAM: an II+, IIe, or compatible machine. Run at normal Apple II speed, about 1 MHz. On a real machine, transfer the image to a 5.25-inch floppy or use a compatible disk-image interface; placing a"
          - code [ref=f1e59]: .dsk
          - text: file inside a DOS filesystem does not turn it into a boot disk.
        - paragraph [ref=f1e60]:
          - strong [ref=f1e61]: Check the paddle’s centre.
          - text: The original code regards raw paddle readings 48–79 as neutral, with 64 a useful target. Lower values steer left; higher values steer right. An emulator that centres the input at 128 will pull right continuously. Adjust the emulated paddle position or range, or the physical joystick’s trim.
        - paragraph [ref=f1e62]: "The brief orchard picture at startup belongs to the program: the loader copies it into screen memory, waits, and then starts the game. The move also overwrites Applesoft’s program area. A reset does not leave the BASIC listing intact; reboot to start cleanly."
      - generic [ref=f1e63]:
        - heading "3. How the program works" [level=2] [ref=f1e64]
        - heading "Low resolution, a wide road" [level=3] [ref=f1e65]
        - paragraph [ref=f1e66]:
          - text: The article makes a point of using
          - code [ref=f1e67]: GR
          - text: rather than high-resolution graphics. In mixed mode the Apple II gives it a 40 × 40 graphics area with four text lines below. Most of the convincing depth comes from the arrangement of the data and the way it is copied.
        - paragraph [ref=f1e68]:
          - text: At startup the program calculates perspective and lane tables in
          - code [ref=f1e69]: $4000–$53FF
          - text: . During play it builds twenty separate 256-byte rows in
          - code [ref=f1e70]: $6000–$73FF
          - text: . The road is a span of
          - code [ref=f1e71]: $AA
          - text: bytes on a
          - code [ref=f1e72]: $CC
          - text: background. Traffic, signs, and the player’s car are added to those rows before a 40-column window is copied to the display.
        - paragraph [ref=f1e73]: Each lores display byte contains two vertically adjacent colour pixels. The road blitter combines the low nibble of one row buffer with the high nibble of the next, then writes to the Apple II’s interleaved screen addresses. Ten separate 256-byte scenery strips provide the horizon and roadside view. Moving their source index makes the landscape scroll.
        - heading "The game loop" [level=3] [ref=f1e74]
        - paragraph [ref=f1e75]: The recovered loop is short enough to show the order of work. Collision is tested before the player’s car is drawn, so the car’s own pixels do not become obstacles. The road and scenery are copied to the screen only after the row buffers are ready.
        - code [ref=f1e77]: "game_loop: jsr clear_road_buffer jsr advance_road_segment jsr advance_curve_and_steer jsr draw_road jsr update_brake jsr draw_traffic_in_depth_order jsr update_left_sign jsr update_right_sign jsr check_player_collision jsr draw_player_car jsr blit_road_window jsr blit_scenery jsr draw_cockpit_details jsr frame_click jsr increment_score jmp game_loop"
        - paragraph [ref=f1e78]:
          - text: At
          - code [ref=f1e79]: update_brake
          - text: ", a working brake subtracts one from the text-based score. The unconditional increment at the end of the loop adds it back, cancelling the usual increase. Score digits are high-bit Apple II characters, not packed BCD."

          - code [ref=f1e341]: "; Crowded Speedway, Dec. 1984: ca65 reconstruction of the REPAIRED dump. ; Source dump addresses $4400-$69FF become runtime $0400-$29FF. ; All instruction/address annotations below use runtime addresses. ; Default source must reproduce the working 9728-byte payload exactly. ; Live code was traced recursively from game_entry ($2970). Two unreferenced ; instruction fragments are identified explicitly. All other bytes are retained ; as data, graphics, or padding; opaque pixels are not treated as opcodes. ; No INCBIN or reference binary is required to assemble this source. .setcpu \"6502\" .include \"memory.inc\" .segment \"PAYLOAD\" .export game_entry, game_loop, handle_crash, game_over, new_game payload_start: .include \"initial-screen.inc\" ; ---------------------------------------------------------------------------- ; Shift/add helper. $50/$51 is the 16-bit addend; $54 supplies bits. ; X+1 iterations build $52/$53. Clobbers A, X, flags and $52-$54; preserves Y. multiply_shift_add: .assert * = $0800, lderror, \"address drift: multiply_shift_add\" lda #$00 ; $0800 A9 00 sta multiply_result_lo ; $0802 85 52 sta multiply_result_hi ; $0804 85 53 L0806: .assert * = $0806, lderror, \"address drift: L0806\" asl multiply_result_lo ; $0806 06 52 rol multiply_result_hi ; $0808 26 53 rol multiply_bits ; $080A 26 54 bcc L081B ; $080C 90 0D clc ; $080E 18 lda multiply_result_lo ; $080F A5 52 adc multiply_factor_lo ; $0811 65 50 sta multiply_result_lo ; $0813 85 52 lda multiply_result_hi ; $0815 A5 53 adc multiply_factor_hi ; $0817 65 51 sta multiply_result_hi ; $0819 85 53 L081B: .assert * = $081B, lderror, \"address drift: L081B\" dex ; $081B CA bpl L0806 ; $081C 10 E8 rts ; $081E 60 ; Retained bytes $081F-$081F: alignment/padding; no reachable instructions. .byte $00 ; $081F / dump $481F ; ---------------------------------------------------------------------------- ; Build perspective/curve lookup pages $4000-$53FF for curve indices 1..63. ; Each page represents one of 20 depth rows. Uses the multiply helper and $02-$05. build_road_positions: .assert * = $0820, lderror, \"address drift: build_road_positions\" lda #$01 ; $0820 A9 01 sta curve_index ; $0822 85 00 L0824: .assert * = $0824, lderror, \"address drift: L0824\" lda #$40 ; $0824 A9 40 sta work_ptr_hi ; $0826 85 03 lda #$00 ; $0828 A9 00 sta work_ptr_lo ; $082A 85 02 sta draw_ptr_lo ; $082C 85 04 sta multiply_factor_lo ; $082E 85 50 L0830: .assert * = $0830, lderror, \"address drift: L0830\" lda #$00 ; $0830 A9 00 sta draw_ptr_hi ; $0832 85 05 lda curve_index ; $0834 A5 00 sec ; $0836 38 sbc #$10 ; $0837 E9 10 bpl L0842 ; $0839 10 07 eor #$FF ; $083B 49 FF clc ; $083D 18 adc #$01 ; $083E 69 01 inc draw_ptr_hi ; $0840 E6 05 L0842: .assert * = $0842, lderror, \"address drift: L0842\" lsr a ; $0842 4A ror multiply_factor_lo ; $0843 66 50 lsr a ; $0845 4A ror multiply_factor_lo ; $0846 66 50 lsr a ; $0848 4A ror multiply_factor_lo ; $0849 66 50 sta multiply_factor_hi ; $084B 85 51 lda draw_ptr_lo ; $084D A5 04 asl a ; $084F 0A asl a ; $0850 0A asl a ; $0851 0A sta multiply_bits ; $0852 85 54 ldx #$04 ; $0854 A2 04 jsr multiply_shift_add ; $0856 20 00 08 lda #$80 ; $0859 A9 80 ldx draw_ptr_hi ; $085B A6 05 bne L0865 ; $085D D0 06 sec ; $085F 38 sbc multiply_result_hi ; $0860 E5 53 jmp L0868 ; $0862 4C 68 08 L0865: .assert * = $0865, lderror, \"address drift: L0865\" clc ; $0865 18 adc multiply_result_hi ; $0866 65 53 L0868: .assert * = $0868, lderror, \"address drift: L0868\" ldy curve_index ; $0868 A4 00 sta (work_ptr_lo),y ; $086A 91 02 inc draw_ptr_lo ; $086C E6 04 inc work_ptr_hi ; $086E E6 03 lda draw_ptr_lo ; $0870 A5 04 cmp #$14 ; $0872 C9 14 bne L0830 ; $0874 D0 BA inc curve_index ; $0876 E6 00 lda curve_index ; $0878 A5 00 cmp #$40 ; $087A C9 40 bne L0824 ; $087C D0 A6 rts ; $087E 60 ; Retained bytes $087F-$087F: alignment/padding; no reachable instructions. .byte $00 ; $087F / dump $487F ; ---------------------------------------------------------------------------- ; Write depth-dependent road widths at offset zero of pages $4000-$5300. ; Widths are 4*depth+2; the renderer uses this table to fill the road. build_road_widths: .assert * = $0880, lderror, \"address drift: build_road_widths\" ldx #$40 ; $0880 A2 40 ldy #$00 ; $0882 A0 00 sty work_ptr_lo ; $0884 84 02 stx work_ptr_hi ; $0886 86 03 sty draw_ptr_lo ; $0888 84 04 L088A: .assert * = $088A, lderror, \"address drift: L088A\" lda draw_ptr_lo ; $088A A5 04 asl a ; $088C 0A asl a ; $088D 0A clc ; $088E 18 adc #$02 ; $088F 69 02 sta (work_ptr_lo),y ; $0891 91 02 inc work_ptr_hi ; $0893 E6 03 inc draw_ptr_lo ; $0895 E6 04 lda draw_ptr_lo ; $0897 A5 04 cmp #$14 ; $0899 C9 14 bne L088A ; $089B D0 ED rts ; $089D 60 ; Retained bytes $089E-$089F: alignment/padding; no reachable instructions. .byte $00, $00 ; $089E / dump $489E ; ---------------------------------------------------------------------------- ; Build seven 15-entry lane/displacement tables at $4050, $4150, ... $4650. ; The traffic update routines select one table through their path pointer. build_traffic_paths: .assert * = $08A0, lderror, \"address drift: build_traffic_paths\" lda #$80 ; $08A0 A9 80 sta multiply_factor_lo ; $08A2 85 50 lsr a ; $08A4 4A sta work_ptr_hi ; $08A5 85 03 lda #$50 ; $08A7 A9 50 sta work_ptr_lo ; $08A9 85 02 lda #$00 ; $08AB A9 00 sta multiply_factor_hi ; $08AD 85 51 sta draw_ptr_lo ; $08AF 85 04 L08B1: .assert * = $08B1, lderror, \"address drift: L08B1\" ldy #$00 ; $08B1 A0 00 L08B3: .assert * = $08B3, lderror, \"address drift: L08B3\" tya ; $08B3 98 asl a ; $08B4 0A asl a ; $08B5 0A asl a ; $08B6 0A asl a ; $08B7 0A sta multiply_bits ; $08B8 85 54 ldx #$03 ; $08BA A2 03 jsr multiply_shift_add ; $08BC 20 00 08 inc multiply_result_hi ; $08BF E6 53 lda multiply_result_hi ; $08C1 A5 53 sta (work_ptr_lo),y ; $08C3 91 02 iny ; $08C5 C8 cpy #$0F ; $08C6 C0 0F bne L08B3 ; $08C8 D0 E9 clc ; $08CA 18 lda multiply_factor_lo ; $08CB A5 50 adc #$80 ; $08CD 69 80 sta multiply_factor_lo ; $08CF 85 50 lda multiply_factor_hi ; $08D1 A5 51 adc #$00 ; $08D3 69 00 sta multiply_factor_hi ; $08D5 85 51 inc work_ptr_hi ; $08D7 E6 03 inc draw_ptr_lo ; $08D9 E6 04 lda draw_ptr_lo ; $08DB A5 04 cmp #$07 ; $08DD C9 07 bne L08B1 ; $08DF D0 D0 rts ; $08E1 60 ; Retained bytes $08E2-$08EF: alignment/padding; no reachable instructions. .byte $00, $00, $00, $00, $00, $00, $00, $00 ; $08E2 / dump $48E2 .byte $00, $00, $00, $00, $00, $00 ; $08EA / dump $48EA ; ---------------------------------------------------------------------------- ; Read ROM through ($06),Y and XOR with the evolving $4E/$4F pair. ; Returns A; advances $08 and the ROM page on wrap. Not a uniform-RNG claim. random_byte: .assert * = $08F0, lderror, \"address drift: random_byte\" ldy random_index ; $08F0 A4 08 lda (random_ptr_lo),y ; $08F2 B1 06 eor random_xor_lo ; $08F4 45 4E eor random_xor_hi ; $08F6 45 4F inc random_index ; $08F8 E6 08 bne L0912 ; $08FA D0 16 inc random_ptr_hi ; $08FC E6 07 bne L0912 ; $08FE D0 12 inc random_xor_lo ; $0900 E6 4E bne reset_random_cursor ; $0902 D0 02 inc random_xor_hi ; $0904 E6 4F ; ---------------------------------------------------------------------------- ; Set the ROM stream cursor to $E000 and index zero; preserves A with PHA/PLA. ; The XOR seed bytes $4E/$4F are deliberately not initialized here. reset_random_cursor: .assert * = $0906, lderror, \"address drift: reset_random_cursor\" pha ; $0906 48 lda #$E0 ; $0907 A9 E0 sta random_ptr_hi ; $0909 85 07 lda #$00 ; $090B A9 00 sta random_ptr_lo ; $090D 85 06 sta random_index ; $090F 85 08 pla ; $0911 68 L0912: .assert * = $0912, lderror, \"address drift: L0912\" rts ; $0912 60 ; Retained bytes $0913-$091F: alignment/padding; no reachable instructions. .byte $00, $00, $00, $00, $00, $00, $00, $00 ; $0913 / dump $4913 .byte $00, $00, $00, $00, $00 ; $091B / dump $491B ; ---------------------------------------------------------------------------- ; Fill twenty 256-byte row buffers at $6000-$73FF with $CC. ; Each byte initially holds background color 12 in both lores nibbles. clear_road_buffer: .assert * = $0920, lderror, \"address drift: clear_road_buffer\" lda #$CC ; $0920 A9 CC ldx #$00 ; $0922 A2 00 L0924: .assert * = $0924, lderror, \"address drift: L0924\" sta $6000,x ; $0924 9D 00 60 sta $6100,x ; $0927 9D 00 61 sta $6200,x ; $092A 9D 00 62 sta $6300,x ; $092D 9D 00 63 sta $6400,x ; $0930 9D 00 64 sta $6500,x ; $0933 9D 00 65 sta $6600,x ; $0936 9D 00 66 sta $6700,x ; $0939 9D 00 67 sta $6800,x ; $093C 9D 00 68 sta $6900,x ; $093F 9D 00 69 sta $6A00,x ; $0942 9D 00 6A sta $6B00,x ; $0945 9D 00 6B sta $6C00,x ; $0948 9D 00 6C sta $6D00,x ; $094B 9D 00 6D sta $6E00,x ; $094E 9D 00 6E sta $6F00,x ; $0951 9D 00 6F sta $7000,x ; $0954 9D 00 70 sta $7100,x ; $0957 9D 00 71 sta $7200,x ; $095A 9D 00 72 sta $7300,x ; $095D 9D 00 73 inx ; $0960 E8 bne L0924 ; $0961 D0 C1 rts ; $0963 60 ; Retained bytes $0964-$096F: alignment/padding; no reachable instructions. .byte $00, $00, $00, $00, $00, $00, $00, $00 ; $0964 / dump $4964 .byte $00, $00, $00, $00 ; $096C / dump $496C ; ---------------------------------------------------------------------------- ; Two short speaker toggles separated by ROM WAIT calls. ; Used for frame pacing and in the crash animation; clobbers A, Y. frame_click: .assert * = $0970, lderror, \"address drift: frame_click\" ldy #$02 ; $0970 A0 02 L0972: .assert * = $0972, lderror, \"address drift: L0972\" lda #$10 ; $0972 A9 10 jsr ROM_WAIT ; $0974 20 A8 FC lda SPEAKER ; $0977 AD 30 C0 dey ; $097A 88 bne L0972 ; $097B D0 F5 rts ; $097D 60 ; Retained bytes $097E-$097F: alignment/padding; no reachable instructions. .byte $00, $00 ; $097E / dump $497E ; ---------------------------------------------------------------------------- ; For each depth: read width at table offset 0, position at curve_index, ; then fill that span in the corresponding $60xx-$73xx buffer with $AA. draw_road: .assert * = $0980, lderror, \"address drift: draw_road\" lda #$40 ; $0980 A9 40 sta work_ptr_hi ; $0982 85 03 lda #$60 ; $0984 A9 60 sta draw_ptr_hi ; $0986 85 05 lda #$00 ; $0988 A9 00 sta work_ptr_lo ; $098A 85 02 sta draw_ptr_lo ; $098C 85 04 L098E: .assert * = $098E, lderror, \"address drift: L098E\" ldy #$00 ; $098E A0 00 lda (work_ptr_lo),y ; $0990 B1 02 tax ; $0992 AA ldy curve_index ; $0993 A4 00 Repair: A4 (LDY curve_index), replacing the literal dump's 44. lda (work_ptr_lo),y ; $0995 B1 02 tay ; $0997 A8 lda #$AA ; $0998 A9 AA L099A: .assert * = $099A, lderror, \"address drift: L099A\" sta (draw_ptr_lo),y ; $099A 91 04 iny ; $099C C8 dex ; $099D CA bne L099A ; $099E D0 FA L09A0: .assert * = $09A0, lderror, \"address drift: L09A0\" inc work_ptr_hi ; $09A0 E6 03 inc draw_ptr_hi ; $09A2 E6 05 lda work_ptr_hi ; $09A4 A5 03 cmp #$54 ; $09A6 C9 54 bne L098E ; $09A8 D0 E4 rts ; $09AA 60 ; ---------------------------------------------------------------------------- ; UNREFERENCED instruction fragment. Reads the keyboard and compares SPACE. ; Its literal BNE targets $09A0 inside draw_road, not this polling instruction. ; No caller was found. Preserve these bytes and the unusual branch unchanged. retained_keyboard_fragment: .assert * = $09AB, lderror, \"address drift: retained_keyboard_fragment\" lda KEYBOARD ; $09AB AD 00 C0 cmp #$A0 ; $09AE C9 A0 bne L09A0 ; $09B0 D0 EE rts ; $09B2 60 ; Retained bytes $09B3-$09BF: alignment/padding; no reachable instructions. .byte $00, $00, $00, $00, $00, $00, $00, $00 ; $09B3 / dump $49B3 .byte $00, $00, $00, $00, $00 ; $09BB / dump $49BB ; ---------------------------------------------------------------------------- ; Return random_byte AND 7, mapping the result 7 to 3. ; The result chooses one of seven lane tables; no statistical guarantee. random_lane: .assert * = $09C0, lderror, \"address drift: random_lane\" jsr random_byte ; $09C0 20 F0 08 and #$07 ; $09C3 29 07 cmp #$07 ; $09C5 C9 07 beq L09CA ; $09C7 F0 01 rts ; $09C9 60 L09CA: .assert * = $09CA, lderror, \"address drift: L09CA\" lda #$03 ; $09CA A9 0
      - generic [ref=f1e192]:
        - heading "5. Build it with cc65" [level=2] [ref=f1e193]
        - paragraph [ref=f1e194]:
          - text: "The modern version uses two tools from the cc65 suite:"
          - strong [ref=f1e195]: ca65
          - text: assembles the 6502 source and
          - strong [ref=f1e196]: ld65
          - text: links it at its runtime addresses. No C compiler or C runtime is involved. Python 3 and
          - strong [ref=f1e197]: a2kit
          - text: generate the BASIC DATA line, tokenize the BASIC programs, and construct a fresh bootable DOS 3.3 disk.
        - paragraph [ref=f1e198]:
          - text: Install GNU Make, ca65/ld65, Python 3, and a2kit so their executables are on your PATH. The build was verified with cc65 V2.19 (git a162565ec) and a2kit 4.4.2. Download
          - link "the source package" [ref=f1e199] [cursor=pointer]:
            - /url: downloads/crowded-speedway-source.zip
          - text: ", then:"
        - code [ref=f1e201]: unzip crowded-speedway-source.zip cd crowded-speedway make make verify
        - paragraph [ref=f1e202]:
          - text: The result is
          - code [ref=f1e203]: build/speedway.dsk
          - text: . The archive includes repaired comparison files for
          - code [ref=f1e204]: make verify
          - text: . The normal
          - code [ref=f1e205]: make
          - text: target builds from
          - code [ref=f1e206]: Makefile
          - text: ","
          - code [ref=f1e207]: src/
          - text: ", and"
          - code [ref=f1e208]: tools/
          - text: alone; it does not extract an old binary or copy a base game disk. a2kit supplies the DOS boot tracks.
        - paragraph [ref=f1e209]: "In the original scratch workspace, the equivalent commands are:"
        - code [ref=f1e211]: "make -C tmp make -C tmp verify # Output: tmp/build/speedway.dsk"
        - paragraph [ref=f1e212]:
          - code [ref=f1e213]: make clean
          - text: removes only the project’s
          - code [ref=f1e214]: build/
          - text: directory.
          - code [ref=f1e215]: make binary
          - text: assembles the game and loader without packaging a disk. Executable paths can be overridden, for example
          - code [ref=f1e216]: make CA65=/path/to/ca65
          - text: .

          - code [ref=e343]: "; Crowded Speedway, Dec. 1984: ca65 reconstruction of the REPAIRED dump. ; Source dump addresses $4400-$69FF become runtime $0400-$29FF. ; All instruction/address annotations below use runtime addresses. ; Default source must reproduce the working 9728-byte payload exactly. ; Live code was traced recursively from game_entry ($2970). Two unreferenced ; instruction fragments are identified explicitly. All other bytes are retained ; as data, graphics, or padding; opaque pixels are not treated as opcodes. ; No INCBIN or reference binary is required to assemble this source. .setcpu \"6502\" .include \"memory.inc\" .segment \"PAYLOAD\" .export game_entry, game_loop, handle_crash, game_over, new_game payload_start: .include \"initial-screen.inc\" ; ---------------------------------------------------------------------------- ; Shift/add helper. $50/$51 is the 16-bit addend; $54 supplies bits. ; X+1 iterations build $52/$53. Clobbers A, X, flags and $52-$54; preserves Y. multiply_shift_add: .assert * = $0800, lderror, \"address drift: multiply_shift_add\" lda #$00 ; $0800 A9 00 sta multiply_result_lo ; $0802 85 52 sta multiply_result_hi ; $0804 85 53 L0806: .assert * = $0806, lderror, \"address drift: L0806\" asl multiply_result_lo ; $0806 06 52 rol multiply_result_hi ; $0808 26 53 rol multiply_bits ; $080A 26 54 bcc L081B ; $080C 90 0D clc ; $080E 18 lda multiply_result_lo ; $080F A5 52 adc multiply_factor_lo ; $0811 65 50 sta multiply_result_lo ; $0813 85 52 lda multiply_result_hi ; $0815 A5 53 adc multiply_factor_hi ; $0817 65 51 sta multiply_result_hi ; $0819 85 53 L081B: .assert * = $081B, lderror, \"address drift: L081B\" dex ; $081B CA bpl L0806 ; $081C 10 E8 rts ; $081E 60 ; Retained bytes $081F-$081F: alignment/padding; no reachable instructions. .byte $00 ; $081F / dump $481F ; ---------------------------------------------------------------------------- ; Build perspective/curve lookup pages $4000-$53FF for curve indices 1..63. ; Each 
  - main [ref=e37]:
    - article [ref=e38]:
      - generic [ref=e39]:
        - heading "1. 만원사례의 고속도로" [level=2] [ref=e40]
        - paragraph [ref=e41]: 원 기사는 한라산을 배경으로 제주도를 일주하는 경주라고 소개한다. 고속도로에는 차가 밀려들고, 길 가장자리에는 커다란 간판이 나타난다. 급커브를 만나면 어느새 차가 엉뚱한 위치에 놓이기도 한다. 도로와 조작에 맞추어 배경까지 움직이니, 작은 블록 그래픽 화면 너머로 훨씬 넓은 풍경이 펼쳐지는 느낌이다.
        - paragraph [ref=e42]: 패들 0번이나 Apple II 조이스틱의 가로축이 필요하다. 타이틀 화면에서 0번 버튼을 누르면 출발한다. 주행 중에는 같은 버튼이 브레이크다. 짧게 끊어 밟아 밀려오는 차 사이에 여유를 만들자. 계속 누르고 있으면 브레이크가 타 버려, 게임이 끝날 때까지 다시 쓸 수 없게 된다.
        - paragraph [ref=e43]: 달리는 동안에는 점수가 오르지만, 정상적으로 작동하는 브레이크를 밟고 있을 때에는 오르지 않는다. 쓸 수 있는 차는 모두 열 대다. 충돌하면 폭발 장면이 번쩍이고 남은 차가 줄어든 뒤 다시 도로로 돌아온다. 차를 모두 쓰면 현재 점수와 최고 점수를 비교하고, 새 게임을 시작할 수 있게 한다.
        - generic [ref=e44]:
          - figure "1984년 12월호 88쪽에 실린 출발선 사진. 복원 자료의 스캔 이미지에서 해당 부분을 잘라 낸 것이다." [ref=e45]:
            - img "원 잡지에 실린 게임의 흑백 사진. 체크무늬 출발선 위에 START라는 글자가 보인다." [ref=e46]
          - figure "수정한 게임의 타이틀 화면을 MAME에서 캡처했다. “PUSH SW0”는 패들 또는 조이스틱의 0번 버튼을 누르라는 뜻이다. 위 화면과 마찬가지로 원본 캡처의 세로 비율을 두 배로 표시했다." [ref=e48]:
            - img "수정한 게임의 컬러 타이틀 화면. CROWDED SPEED WAY 아래에 PUSH SW0라는 안내가 표시된다." [ref=e50]
        - paragraph [ref=e52]: 1984년 기사는 이 프로그램이 일본 ASCII 1983년 1월호에 소개되었다고 밝힌다. 여기서는 한국어 원문의 설명을 옮겼으며, 이 개정판을 만들면서 앞선 일본어 기사를 별도로 대조하지는 않았다.
      - generic [ref=e53]:
        - heading "2. Apple II에서 실행하기" [level=2] [ref=e54]
        - paragraph [ref=e55]:
          - text: 제공하는 이미지는 DOS 섹터 순서로 저장한 140 KB DOS 3.3 부팅 디스크다. 1번 드라이브에 넣고 부팅하면
          - code [ref=e56]: HELLO
          - text: 가 자동으로
          - code [ref=e57]: SPEEDWAY-RUN
          - text: 을 실행한다. 디스크를 넣은 상태에서 이미 DOS가 실행 중이라면 다음과 같이 입력한다.
        - code [ref=e59]: RUN SPEEDWAY-RUN
        - paragraph [ref=e60]:
          - text: Applesoft ROM과 48 KB 이상의 RAM을 갖춘 Apple II가 필요하다. II+, IIe 또는 호환 기종을 사용하고, 속도는 약 1 MHz의 원래 Apple II 속도로 맞춘다. 실기에서는 이미지를 5.25인치 플로피로 전송하거나 호환되는 디스크 이미지 장치를 사용한다. DOS 파일 시스템 안에
          - code [ref=e61]: .dsk
          - text: 파일을 복사하는 것만으로는 부팅 디스크가 되지 않는다.
        - paragraph [ref=e62]:
          - strong [ref=e63]: 패들의 중립 위치를 확인하자.
          - text: 원래 코드는 패들 입력값 48–79를 중립으로 취급하므로, 64 정도가 적당하다. 이보다 낮으면 왼쪽, 높으면 오른쪽으로 조향한다. 입력 중심이 128인 에뮬레이터에서는 차가 계속 오른쪽으로 쏠린다. 에뮬레이터의 패들 위치나 입력 범위, 또는 실제 조이스틱의 중심 조절 장치를 맞추어야 한다.
        - paragraph [ref=e64]: 시작할 때 잠깐 보이는 사과밭 그림도 프로그램의 일부다. 로더가 이 그림을 화면 메모리에 복사하고 잠시 기다린 뒤 게임을 시작한다. 이 메모리 이동은 Applesoft의 프로그램 영역도 덮어쓴다. 리셋해도 BASIC 목록이 그대로 남아 있지는 않으므로, 다시 시작할 때에는 재부팅하는 편이 확실하다.
      - generic [ref=e65]:
        - heading "3. 프로그램의 동작 원리" [level=2] [ref=e66]
        - heading "저해상도로 그리는 넓은 도로" [level=3] [ref=e67]
        - paragraph [ref=e68]:
          - text: 원 기사는 고해상도 대신
          - code [ref=e69]: GR
          - text: 을 사용한다는 점을 강조한다. Apple II의 혼합 모드에서는 40 × 40 그래픽 영역 아래에 네 줄의 문자를 표시할 수 있다. 그 작은 화면에서 깊이감을 만드는 비결은 데이터의 배치와 복사 방법에 있다.
        - paragraph [ref=e70]:
          - text: 시작할 때 프로그램은
          - code [ref=e71]: $4000–$53FF
          - text: 에 원근과 차선 위치를 위한 표를 계산해 둔다. 주행 중에는
          - code [ref=e72]: $6000–$73FF
          - text: 에 각각 256바이트인 행 버퍼 스무 개를 만든다. 도로는
          - code [ref=e73]: $CC
          - text: 배경 위에
          - code [ref=e74]: $AA
          - text: 바이트를 일정 구간 채워 그린다. 여기에 다른 차와 간판, 플레이어의 차를 얹은 뒤 40열 너비의 창을 실제 화면으로 복사한다.
        - paragraph [ref=e75]: 저해상도 화면의 한 바이트에는 위아래로 붙은 색상 픽셀 두 개가 들어간다. 도로 전송 루틴은 한 행 버퍼의 하위 니블과 다음 행의 상위 니블을 합친 뒤, Apple II 특유의 교차 배치된 화면 주소에 써 넣는다. 별도로 마련한 256바이트짜리 배경 띠 열 개는 지평선과 길가 풍경을 담당한다. 이 띠를 읽는 위치를 바꾸면 풍경이 스크롤된다.
        - heading "게임 루프" [level=3] [ref=e76]
        - paragraph [ref=e77]: 복원한 루프는 작업 순서를 한눈에 볼 수 있을 만큼 짧다. 플레이어의 차를 그리기 전에 충돌을 검사하므로, 자기 차의 픽셀을 장애물로 오인하지 않는다. 도로와 배경은 행 버퍼의 준비가 끝난 뒤 화면에 복사한다.
        - code [ref=e79]: "game_loop: jsr clear_road_buffer jsr advance_road_segment jsr advance_curve_and_steer jsr draw_road jsr update_brake jsr draw_traffic_in_depth_order jsr update_left_sign jsr update_right_sign jsr check_player_collision jsr draw_player_car jsr blit_road_window jsr blit_scenery jsr draw_cockpit_details jsr frame_click jsr increment_score jmp game_loop"
        - paragraph [ref=e80]:
          - code [ref=e81]: update_brake
          - text: 는 브레이크가 작동하는 동안 문자로 저장된 점수에서 1을 뺀다. 루프 끝에서 무조건 실행되는 점수 증가가 다시 1을 더하므로, 평소의 점수 상승이 상쇄된다. 점수는 패킹된 BCD가 아니라 최상위 비트가 켜진 Apple II 문자로 저장한다.

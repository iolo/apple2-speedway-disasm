        - heading "7. 어디까지 검증했는가" [level=2] [ref=e264]
        - list [ref=e265]:
          - listitem [ref=e266]: 어셈블한 9,728바이트 프로그램이 수정한 모니터 덤프 1,216행 전체와 일치한다.
          - listitem [ref=e267]: 어셈블한 44바이트 로더가 수정판 BASIC DATA 행과 일치하며, 생성한 BASIC 목록도 동일하다.
          - listitem [ref=e268]: 다시 만든 143,360바이트 디스크 전체가 파일 시스템 배치까지 포함해 정상 동작한 수정판 디스크와 일치한다.
          - listitem [ref=e269]: 소스만 넣은 빈 디렉터리 두 곳에서 각각 빌드해 같은 디스크를 얻었다. 소스의 한 바이트를 바꾸는 시험에서도 바이너리와 디스크에 변경이 반영되는 것을 확인했고, 시험 후 기준 버전으로 되돌렸다.
          - listitem [ref=e270]: 수정한 디스크는 Apple2TS에서 자동 부팅되었다. MAME 0.285의 초기형 IIe에서는 게임 루프를 575회 진행하며 좌우 조향, 커브, 제동, 브레이크 소진, 열 번의 충돌과 게임 종료를 확인했다. 재시작 후에도 최고 점수가 유지되었고, 이어서 루프를 80회 더 진행했다.
        - paragraph [ref=e271]: 디스어셈블리 빌드 결과가 그 디스크와 완전히 같으므로 앞서 얻은 에뮬레이터 검증 결과를 그대로 적용한다. 소스 재구성과 이 HTML판을 만들면서 에뮬레이터를 새로 실행하지는 않았으며, 실제 기계에서 시험했다고 주장하지도 않는다.

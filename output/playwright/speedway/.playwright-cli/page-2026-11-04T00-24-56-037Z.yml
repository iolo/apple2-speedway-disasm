        - paragraph [ref=e329]: 이 글은 기존 복원 자료를 바탕으로 1984년 12월호 88–97쪽 기사를 다시 구성한 한국어 개정판이다. 원제, 편집부 크레디트, 게임 규칙, GR에 관한 설명, 두 개의 목록을 입력하는 방식과 일본 잡지에 대한 언급은 원 기사에서 가져왔다. 긴 모니터 입력 목록 대신 수정하고 주석을 붙인 ca65 소스와 재현 가능한 빌드 방법을 담았다.
        - paragraph [ref=e330]: 위의 잡지 사진은 원문 88쪽에서 잘라 낸 이미지다. 컬러 화면 두 장은 수정한 프로그램을 MAME에서 실행해 캡처했다. 페이지에서는 세로 표시 비율을 보정했으며 원본 PNG 파일은 바꾸지 않았다. 소스 주석, 수정 내역, 메모리 레이블, 시험 결과와 빌드 설명은 이번에 덧붙인 내용이다.

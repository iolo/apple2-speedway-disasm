        - heading "충돌 처리는 호출한 자리로 돌아가지 않는다" [level=3] [ref=e250]
        - paragraph [ref=e251]:
          - text: 충돌 검사 루틴은 JSR로 호출하지만, 충돌하면 바로
          - code [ref=e252]: handle_crash
          - text: 로 점프한다. 이 처리기는 PLA 두 번으로 스택에서 복귀 주소를 제거한다. 애니메이션이 끝나면 다음 차를 준비하는 경로로 이어진다. 이를 보통의 복귀형 서브루틴으로 바꾸면 프로그램의 제어 흐름이 달라진다.
        - code [ref=e254]: "check_player_collision: ; ... test the player footprint ... jmp handle_crash handle_crash: pla ; discard collision checker return address, low byte pla ; discard high byte ; ... draw crash frames and delay ... jmp lose_car_and_restart"
        - heading "주석으로 설명한 것과 아직 알 수 없는 것" [level=3] [ref=e255]
        - paragraph [ref=e256]:
          - code [ref=e257]: draw_road
          - text: ","
          - code [ref=e258]: update_brake
          - text: 같은 이름은 복원 과정에서 파악한 동작을 설명하기 위한 것으로, 원저자의 레이블이 아니다. 그림의 의미가 확실하지 않은 부분은 그렇게 표시했다. 첫 번째 차량의 조회 포인터 설정부
          - code [ref=e259]: $0A0A–$0A0D
          - text: 에 있는 특이한 CMP/STA 조합도 그대로 두었고, 참조하는 곳을 찾지 못한

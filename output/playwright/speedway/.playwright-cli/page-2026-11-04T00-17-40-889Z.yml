85 66 lda #$00 ; $0A14 A9 00 sta car_one_draw_lo ; $0A16 85 65 sta car_one_lookup_lo ; $0A18 85 67 clc ; $0A1A 18 ldy curve_index ; $0A1B A4 00 lda (car_one_lookup_lo),y ; $0A1D B1 67 ldy car_one_depth ; $0A1F A4 63 adc (car_one_path_lo),y ; $0A21 71 61 sta work_ptr_lo ; $0A23 85 02 lda car_one_depth ; $0A25 A5 63 cmp #$0F ; $0A27 C9 0F bmi L0A30 ; $0A29 30 05 lda #$00 ; $0A2B A9 00 sta car_one_active ; $0A2D 85 60 L0A2F: .assert * = $0A2F, lderror, \"address drift: L0A2F\" rts ; $0A2F 60 L0A30: .assert * = $0A30, lderror, \"address drift: L0A30\" cmp #$0A ; $0A30 C9 0A bpl L0A9B ; $0A32 10 67 cmp #$06 ; $0A34 C9 06 bpl L0A67 ; $0A36 10 2F cmp #$03 ; $0A38 C9 03 bpl L0A46 ; $0A3A 10 0A ldy work_ptr_lo ; $0A3C A4 02 lda #$66 ; $0A3E A9 66 sta (car_one_draw_lo),y ; $0A40 91 65 iny ; $0A42 C8 sta (car_one_draw_lo),y ; $0A43 91 65 rts ; $0A45 60 L0A46: .assert * = $0A46, lderror, \"address drift: L0A46\" dec work_ptr_lo ; $0A46 C6 02 ldy work_ptr_lo ; $0A48 A4 02 lda #$66 ; $0A4A A9 66 sta (car_one_draw_lo),y ; $0A4C 91 65 iny ; $0A4E C8 sta (car_one_draw_lo),y ; $0A4F 91 65 iny ; $0A51 C8 sta (car_one_draw_lo),y ; $0A52 91 65 inc car_one_draw_hi ; $0A54 E6 66 ldy work_ptr_lo ; $0A56 A4 02 lda #$00 ; $0A58 A9 00 sta (car_one_draw_lo),y ; $0A5A 91 65 iny ; $0A5C C8 lda #$11 ; $0A5D A9 11 sta (car_one_draw_lo),y ; $0A5F 91 65 iny ; $0A61 C8 lda #$00 ; $0A62 A9 00 sta (car_one_draw_lo),y ; $0A64 91 65 rts ; $0A66 60 L0A67: .assert * = $0A67, lderror, \"address drift: L0A67\" dec work_ptr_lo ; $0A67 C6 02 dec work_ptr_lo ; $0A69 C6 02 dec work_ptr_lo ; $0A6B C6 02 lda curve_index ; $0A6D A5 00 cmp #$10 ; $0A6F C9 10 bmi L0A7F ; $0A71 30 0C cmp #$31 ; $0A73 C9 31 bpl L0A7B ; $0A75 10 04 ldx #$00 ; $0A77 A2 00 beq L0A81 ; $0A79 F0 06 L0A7B: .assert * = $0A7B, lderror, \"address drift: L0A7B\" ldx #$20 ; $0A7B A2 20 bne L0A81 ; $0A7D D0 02 L0A7F: .assert * = $0A7F, lderror, \"address drift: L0A7F\" ldx #$40 ; $0A7F A2 40 L0A81: .assert * = $0A81, lderror, \"address drift: L0A8
      - generic [ref=f1e226]:
        - heading "6. Reading the disassembly" [level=2] [ref=f1e227]
        - heading "Assemble for the address where the code will run" [level=3] [ref=f1e228]
        - paragraph [ref=f1e229]:
          - text: The payload is loaded at
          - code [ref=f1e230]: $4400–$69FF
          - text: ", but executed at"
          - code [ref=f1e231]: $0400–$29FF
          - text: . All source labels, branches, and absolute references use the second range. Add
          - code [ref=f1e232]: $4000
          - text: to a runtime address to find its byte in the monitor dump.
        - code [ref=f1e234]: "# Labels use runtime addresses. DOS loads the resulting raw bytes at $4400; # the $0300 relocation stub moves them down by $4000 before entry at $2970. MEMORY { RUNTIME: start = $0400, size = $2600, type = rw, file = %O; } SEGMENTS { PAYLOAD: load = RUNTIME, type = ro; }"
        - paragraph [ref=f1e235]:
          - text: The separate loader at
          - code [ref=f1e236]: $0300
          - text: sets the monitor’s source, end, and destination pointers, calls MOVE at
          - code [ref=f1e237]: $FE2C
          - text: ", delays, and jumps to"
          - code [ref=f1e238]: game_entry
          - text: at
          - code [ref=f1e239]: $2970
          - text: . Its complete source appears below. The raw payload is not meant to be BRUN at its staging address.
        - heading "Code where there is code; bytes where there are pictures" [level=3] [ref=f1e240]
        - paragraph [ref=f1e241]:
          - text: Following calls, jumps, branches, and fallthrough from
          - code [ref=f1e242]: $2970
          - text: identifies
          - strong [ref=f1e243]: 1,281 reachable instructions occupying 2,673 bytes
          - text: . Another 11 bytes are two unreferenced instruction fragments. The remaining 7,044 bytes are retained data and padding. The source therefore does not mistake rows of scenery pixels for executable opcodes.
        - paragraph [ref=f1e244]:
          - text: Medium and large traffic sprites use
          - code [ref=f1e245]: $FF
          - text: row terminators. Player sprites use zero for transparency. Title and game-over images retain every byte of their 1 KB page layouts, including screen holes. These live in readable
          - code [ref=f1e246]: .byte
          - text: includes; the build has no
          - code [ref=f1e247]: INCBIN
          - text: dependency.
        - heading "A crash is a nonlocal jump" [level=3] [ref=f1e248]
        - paragraph [ref=f1e249]:
          - text: The collision checker is called with JSR, but on a collision it jumps directly to
          - code [ref=f1e250]: handle_crash
          - text: . The handler starts with two PLA instructions to remove that return address from the stack. After the animation it continues into the next-car path. Rewriting it as an ordinary returning subroutine would change the program’s control flow.
        - code [ref=f1e252]: "check_player_collision: ; ... test the player footprint ... jmp handle_crash handle_crash: pla ; discard collision checker return address, low byte pla ; discard high byte ; ... draw crash frames and delay ... jmp lose_car_and_restart"
        - heading "What the comments do—and do not—claim" [level=3] [ref=f1e253]
        - paragraph [ref=f1e254]:
          - text: Names such as
          - code [ref=f1e255]: draw_road
          - text: and
          - code [ref=f1e256]: update_brake
          - text: describe recovered behavior, not original author labels. Uncertain visual details are identified as such. The source also preserves an unusual CMP/STA sequence in the first traffic car’s lookup setup at
          - code [ref=f1e257]: $0A0A–$0A0D
          - text: ", and labels two unreferenced fragments at"
          - code [ref=f1e258]: $09AB–$09B2
          - text: and
          - code [ref=f1e259]: $295F–$2961
          - text: . This disassembly adds no further gameplay repairs.
        - paragraph [ref=f1e260]: Address assertions keep the fixed layout honest. Same-size instruction and data edits are straightforward; inserting bytes requires accommodating them in padding and checking the fixed-address assumptions. The source’s address/byte comments describe the baseline.
      - generic [ref=f1e261]:
        - heading "7. What has been verified" [level=2] [ref=f1e262]
        - list [ref=f1e263]:
          - listitem [ref=f1e264]: The assembled 9,728-byte payload matches all 1,216 rows of the corrected monitor dump.
          - listitem [ref=f1e265]: The assembled 44-byte stub matches the repaired BASIC DATA line, and the generated BASIC listing is identical.
          - listitem [ref=f1e266]: The entire rebuilt 143,360-byte disk matches the working repaired disk, including its filesystem layout.
          - listitem [ref=f1e267]: Two separate clean source-only builds produced the same disk. A one-byte source-edit probe reached both the binary and the disk; the baseline was restored afterward.
          - listitem [ref=f1e268]: The repaired disk booted automatically in Apple2TS. In MAME 0.285 on an unenhanced IIe, 575 gameplay updates exercised both steering directions, curves, braking, brake burnout, ten collisions, and game over. Restart preserved the high score, followed by another 80 gameplay updates.
        - paragraph [ref=f1e269]: The disassembly build reproduces that exact disk, so it reuses the earlier emulator results. No new emulator run was performed for the source reconstruction or this HTML edition, and a physical-machine test is not claimed.
